/* 排障：任何脚本错误直接显示在屏幕顶部，方便远程定位设备差异问题 */
(function () {
  function show(msg, color) {
    var b = document.getElementById('errBanner');
    if (!b) {
      b = document.createElement('div');
      b.id = 'errBanner';
      b.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99999;color:#fff;font:13px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;padding:10px 14px;border-radius:12px;word-break:break-all;box-shadow:0 4px 16px rgba(0,0,0,.28)';
      (document.body || document.documentElement).appendChild(b);
    }
    b.style.background = color || '#b3261e';
    b.innerHTML = msg;
  }
  window.addEventListener('error', function (e) {
    show('<b>页面脚本出错，请截图发给开发者：</b><br>' + (e.message || '未知脚本错误') + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason && e.reason.message ? e.reason.message : String(e.reason);
    show('<b>后台任务出错（一般不影响使用）：</b><br>' + r, '#9a6b00');
  });
  /* 微信 / QQ 等内置浏览器：引导用 Safari 打开，这类环境会限制存储与功能 */
  if (/MicroMessenger|MicroMessage|QQ\/|Weibo|WorkBuddy/i.test(navigator.userAgent) || (window.top !== window.self)) {
    document.addEventListener('DOMContentLoaded', function () {
      show('<b>检测到你正在 App 内置浏览器中打开。</b>为了能保存学习记录、正常使用全部功能，请点右上角「···」→ 选择「在 Safari 中打开」（或复制链接，粘贴到 Safari 地址栏打开）', '#4f63d2');
    });
  }
})();
</script>

<script>
(function () {
  /* 手动强制更新：注销全部 SW + 清空全部缓存 + 重载。
     供 App 内「设置 → 检查更新」按钮调用，以后迭代不用删图标、数据也不丢。 */
  window.SB_FORCE_UPDATE = function () {
    var jobs = [];
    try {
      if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister().catch(function () {}); }));
        }).catch(function () {}));
      }
    } catch (e) {}
    try {
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }).catch(function () {}));
      }
    } catch (e) {}
    try { sessionStorage.removeItem('wb_sw_reloaded'); } catch (e) {}
    return Promise.all(jobs).then(function () { location.reload(); });
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) return;
        try {
          if (sessionStorage.getItem('wb_sw_reloaded')) return;
          sessionStorage.setItem('wb_sw_reloaded', '1');
        } catch (e) { return; }
        location.reload();
      });
      navigator.serviceWorker.register('sw.js?v=48').then(function (reg) {
        // 每次打开都主动向服务器核对一次 SW，避免 iOS 长期不检查更新
        try { reg.update(); } catch (e) {}
      }).catch(function () {});
    });
  }
})();
</script>
